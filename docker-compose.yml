services:
  postgres:
    image: postgres:16
    container_name: wagering-postgres

    environment:
      POSTGRES_DB: ${DB_NAME:-wagering}
      POSTGRES_USER: ${DB_USER:-wagering}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-wagering}

    ports:
      - "${DB_PORT:-5432}:5432"

  localstack:
    image: localstack/localstack:3.8.1
    container_name: wagering-localstack

    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: us-east-1
      SQS_ENDPOINT_STRATEGY: path

    ports:
      - "4566:4566"